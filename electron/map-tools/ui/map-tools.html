<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://127.0.0.1:*; frame-src http://127.0.0.1:*; connect-src http://127.0.0.1:*;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CurviosClash Map Tools</title>
    <link rel="stylesheet" href="./map-tools.css">
  </head>
  <body>
    <div class="map-tools-shell" data-testid="map-tools-shell">
      <header class="shell-bar">
        <div class="brand">
          <span class="brand-mark">CC</span>
          <div>
            <h1>Map Tools</h1>
            <p id="repoRoot">Repository wird geladen</p>
          </div>
        </div>
        <nav id="viewTabs" class="view-tabs" aria-label="Karten"></nav>
        <div class="actions">
          <button id="refreshCurrent" type="button">Aktualisieren <span class="button-help" data-help-term="refresh-current" aria-label="Aktualisieren erklaeren">i</span></button>
          <button id="refreshAll" type="button">Alle Exporte <span class="button-help" data-help-term="refresh-all" aria-label="Alle Exporte erklaeren">i</span></button>
          <button id="infoToggle" type="button" class="is-active" aria-pressed="true">Info</button>
        </div>
      </header>

      <section class="status-bar" aria-live="polite">
        <div>
          <strong id="activeViewLabel">Plan Map</strong>
          <button type="button" class="help-button" data-help-term="active-view" aria-label="Aktive Karte erklaeren">i</button>
          <span id="refreshStatus">bereit</span>
        </div>
        <div id="lastRefresh" class="last-refresh">noch kein Refresh</div>
      </section>

      <section id="errorPanel" class="error-panel" hidden>
        <div>
          <strong id="errorTitle">Export fehlgeschlagen</strong>
          <pre id="errorDetail"></pre>
        </div>
        <button id="retryRefresh" type="button">Erneut versuchen</button>
      </section>

      <div id="helpPopover" class="help-popover" role="dialog" aria-live="polite" hidden></div>

      <main class="viewer-stage">
        <iframe id="mapFrame" title="Curvios Map Viewer"></iframe>
      </main>
    </div>
    <script type="module" src="./map-tools-renderer.js"></script>
  </body>
</html>
