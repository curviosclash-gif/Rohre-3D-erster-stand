<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CurviosClash Settings Studio</title>
    <link rel="stylesheet" href="./settings-studio.css" />
</head>
<body>
    <div class="layout">
        <header class="header">
            <span class="header__title" data-bind="title"></span>
            <div class="header__controls">
                <label data-bind="language-label" for="language-select"></label>
                <select id="language-select" data-bind="language-select">
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <div class="body">
            <nav class="sidebar">
                <ul class="nav-list" data-bind="sidebar-nav" role="tablist"></ul>
            </nav>

            <main class="form-area">
                <div class="section-header">
                    <h2 class="section-title" data-bind="section-title"></h2>
                    <div class="section-actions">
                        <span class="change-badge" data-bind="change-count" hidden></span>
                        <button class="btn btn--ghost" data-action="reset-section" type="button" data-bind="reset-section-label"></button>
                    </div>
                </div>
                <div class="form-content" data-bind="form-content"></div>
            </main>
        </div>

        <footer class="toolbar">
            <div class="status" data-bind="status"></div>
            <div class="toolbar__actions">
                <button class="btn btn--ghost" data-action="reset-all" type="button" data-bind="reset-all-label"></button>
                <button class="btn" data-action="validate" type="button" data-bind="validate-label"></button>
                <button class="btn btn--primary" data-action="save" type="button" data-bind="save-label"></button>
            </div>
        </footer>
    </div>

    <script type="module" src="./settings-studio-app.js"></script>
</body>
</html>
