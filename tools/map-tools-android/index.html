<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Curvios Map Tools</title>
    <link rel="stylesheet" href="./map-tools-android.css">
  </head>
  <body>
    <main class="map-tools-app" data-testid="map-tools-android-shell">
      <header class="app-bar">
        <div class="brand">
          <span class="eyebrow">CurviosClash</span>
          <h1>Map Tools</h1>
        </div>
        <div class="view-switch" role="tablist" aria-label="Karte waehlen">
          <button type="button" role="tab" data-view-id="plan" aria-selected="true">Plan</button>
          <button type="button" role="tab" data-view-id="repo" aria-selected="false">Repo</button>
          <button type="button" role="tab" data-view-id="agent" aria-selected="false">Agent</button>
        </div>
        <div class="update-actions" aria-label="GitHub Update">
          <button type="button" id="updateCheck">Update</button>
          <button type="button" id="updateOpen" hidden>GitHub</button>
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="activeLabel">Plan Map</span>
        <span id="buildMeta">read-only Android snapshot</span>
        <span id="updateStatus">GitHub Releases</span>
      </section>

      <section id="planFilterStrip" class="plan-filter-strip" aria-label="Plan Map Arbeitsstrom">
        <label>
          <span>Arbeitsstrom</span>
          <select id="planWorkstream" data-testid="map-tools-android-workstream">
            <option value="all">Alle</option>
            <option value="main-game">Hauptspiel</option>
            <option value="map-tools-settings">Map/Settings</option>
            <option value="android-mobile">Android</option>
            <option value="architecture-runtime">Architektur</option>
            <option value="repo-governance">Repo</option>
            <option value="ai-graph-tools">AI/Graph</option>
          </select>
        </label>
        <button type="button" id="infoToggle" class="is-active" aria-pressed="true" data-testid="map-tools-android-info-toggle">Info</button>
      </section>

      <div id="helpPopover" class="help-popover" role="dialog" aria-live="polite" hidden></div>

      <iframe
        id="mapFrame"
        class="map-frame"
        title="Curvios Map Tools Viewer"
        src="./tools/plan-map/index.html"
      ></iframe>
    </main>

    <script type="module" src="./map-tools-android.js"></script>
  </body>
</html>
