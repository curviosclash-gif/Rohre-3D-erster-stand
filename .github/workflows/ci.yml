name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  guards-contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Electron Dependencies
      run: npm --prefix electron ci

    - name: Configure Electron Sandbox
      run: |
        sandbox_path="electron/node_modules/electron/dist/chrome-sandbox"
        sudo chown root:root "$sandbox_path"
        sudo chmod 4755 "$sandbox_path"

    - name: Plan Check
      run: npm run plan:check

    - name: Sync Documentation Freshness
      run: npm run docs:sync

    - name: Check Documentation State (AGENTS.md rules)
      run: npm run docs:check

    - name: Run Architecture Guard
      run: npm run architecture:guard

    - name: Run Node Contract Tests
      run: npm run test:contract

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Smoke
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run test:smoke
